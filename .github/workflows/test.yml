name: Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  node_build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint:hbs
      - run: npm run lint:js
      - run: npm run test:ember

  ember_try:
    runs-on: ubuntu-latest
    needs: node_build_and_test
    strategy:
      fail-fast: false
      matrix:
        scenario: [ember-lts-4.4, ember-lts-4.12]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npx ember try:one ${{ matrix.scenario }} --skip-cleanup
